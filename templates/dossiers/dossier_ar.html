<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body {{
      font-family: 'Amiri', 'Noto Naskh Arabic', Arial, sans-serif;
      direction: rtl;
      unicode-bidi: embed;
      margin: 40px;
      color: #222;
    }}
    h1 {{ color: #006400; border-bottom: 2px solid #006400; padding-bottom: 8px; }}
    .field {{ margin: 12px 0; font-size: 15px; }}
    .label {{ font-weight: bold; color: #555; display: inline-block; width: 180px; }}
  </style>
</head>
<body>
  <h1>🕌 جامع ناروبي — ملف المشارك</h1>
  <div class="field"><span class="label">رقم الطالب:</span> {student_id}</div>
  <div class="field"><span class="label">الاسم الكامل:</span> {student_name}</div>
  <div class="field"><span class="label">الفئة:</span> {category_name}</div>
  <div class="field"><span class="label">الموسم:</span> {season}</div>
</body>
</html>
