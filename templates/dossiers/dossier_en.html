<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

    .field {{ margin: 12px 0; font-size: 15px; }}

  </style>
</head>
<body>

  <div class="field"><span class="label">Category:</span> {category_name}</div>
  <div class="field"><span class="label">Season:</span> {season}</div>
</body>
</html>
