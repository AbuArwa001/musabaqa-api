[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musabaqa-api"
version = "0.1.0"
description = "Jamia Mosque Nairobi — Quran Memorization Competition API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "weasyprint>=62.0",
    "python-bidi>=0.4.2",
    "arabic-reshaper>=3.0.0",
    "xlsxwriter>=3.2.0",
    "boto3>=1.35.0",
    "resend>=2.0.0",
    "knockapi>=0.6.0",
    "africastalking>=1.2.5",
    "Pillow>=10.0.0",
    "aiofiles>=24.1.0",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
